settings-turrets-vet-active=Включает систему ветеранства турелей: при выполнении условий по убийствам и урону турели получают больше урона, дальности и скорострельности.
settings-turrets-vet-kill-damage-check-type=Что учитывать при повышении ранга турели: число убийств, нанесённый урон или и то, и другое. \nПримечание: независимо от выбора проверка выполняется только тогда, когда турель кого-нибудь убивает.
settings-turrets-vet-bonus-increase=Сколько дополнительного здоровья, скорострельности и дальности получает турель при повышении ранга.
settings-turrets-vet-damage-milestones=Сколько урона нужно нанести, чтобы получить каждый следующий ранг.
settings-turrets-vet-kill-milestones=Сколько врагов нужно убить, чтобы получить каждый следующий ранг.
settings-loaders-electricity=Погрузчикам для работы требуется электричество.
settings-crashsite-bonus-buildingstats=Насколько больше мощность и скорость создания у построек на месте крушения в начале игры.
settings-crashsite-bonus-equipment=Сколько дополнительных боеприпасов, здоровья, оружия, брони и так далее выдаётся на месте крушения в начале игры.
settings-crashsite-bonus-scrap=Сколько дополнительного металлолома находится в обломках корабля на месте крушения в начале игры.
settings-crashsite-x-players=Умножает количество снаряжения и дронов на это число игроков, чтобы каждому досталось своё.
settings-crashsite-robots=Начните с простым модульным жилетом и строительными дронами.
settings-combat-friendlyfire-percent=Процент входящего урона от непрямого огня (ракеты, миномёты и другой мгновенный взрывной урон, от которого сложно уклониться).
settings-warehouse-abandonments=Создавать ли заброшенные аванпосты с турелями, электроснабжением, складами и добычей.
settings-status-panels=Добавляет в мир маленькие простые световые панели, показывающие состояние сборочных автоматов, печей и буров, у которых таких индикаторов нет.
settings-recipe-cost=Какие ингредиенты (и скольких видов) идут на создание исследовательских пакетов.
settings-tech-progressive-increment-amount=Каждая изученная технология увеличивает стоимость следующей (в %).\n(Внимательно относитесь к порядку исследований, пока это включено!)
settings-character-selection=Выберите другого персонажа — у каждого свои базовые характеристики. (Наведите курсор на персонажа, чтобы их увидеть.)
settings-crashsite=В начале игры создаёт генератор, сборочные автоматы и лабораторию рядом с разбившимся кораблём.
settings-rocket-recipe=Во сколько раз увеличивается количество процессоров, конструкций малой плотности и ракетного топлива, идущих на одну деталь ракеты.
settings-rocket-recipe-energy=Во сколько раз увеличивается время (энергия) создания одной детали ракеты.
settings-chunks-probability=Вероятность выпадения инопланетных кусков из ульев и врагов среднего размера и крупнее (в %).
settings-chunks-multiplier=Множитель максимального количества инопланетных кусков, выпадающих из ульев и врагов среднего размера и крупнее.
settings-warehouse-spacing=Как часто склады встречаются на заброшенных аванпостах.
settings-warehouse-scaling=Как сильно растёт ценность добычи на складах аванпостов с расстоянием. (Чем выше %, тем медленнее рост)
settings-warehouse-barren=После достижения максимальной дистанции склады будут пустыми, чтобы добыча с них не повторялась бесконечно.
settings-loaders-active=Определяет, будут ли погрузчики доступны в текущей игре.
settings-loaders-cost=Изменяет стоимость погрузчиков в материалах для баланса.
settings-enemy-health=Базовое здоровье врагов (включает: существ, постройки, ульи, турели и так далее)
settings-enemy-spawntime=Как часто ульи будут создавать врагов по сравнению с базовым временем.
settings-world-daynightcycle=Задаёт длительность всего дня (день и ночь, суммарно в минутах)
settings-spoilage-multiplier=Через какое время определённые предметы портятся.



